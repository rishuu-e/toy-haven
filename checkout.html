<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOY HAVEN - Checkout</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E🧸%3C/text%3E%3C/svg%3E">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo">TOY HAVEN</div>
            <div class="hamburger" id="hamburger">☰</div>
            <nav class="main-nav" id="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <a href="feedback.html">Support</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title mt-1">Secure Checkout</h2>
        
        <div class="checkout-layout mt-1">
            <div class="checkout-form-container">
                <form id="checkout-form">
                    <div class="form-section">
                        <h3>Shipping Details</h3>
                        <label>Full Name *</label>
                        <input type="text" id="chk-name" placeholder="Enter your full name" required>
                        
                        <label>Email *</label>
                        <input type="email" id="chk-email" placeholder="Enter your email address" required>
                        
                        <label>Address *</label>
                        <input type="text" id="chk-address" placeholder="Street address" required>
                        
                        <div class="grid-2">
                            <div>
                                <label>City</label>
                                <input type="text" id="chk-city" placeholder="Enter city" required>
                            </div>
                            <div>
                                <label>Postal Code</label>
                                <input type="text" id="chk-postal" placeholder="Enter postal code" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section mt-1">
                        <h3>Payment Method</h3>
                        <label class="radio-label">
                            <input type="radio" name="payment" value="card" checked> 
                            <span>Credit Card <span class="card-icons">💳</span></span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="payment" value="cod"> 
                            <span>Cash on Delivery</span>
                        </label>
                        
                        <div class="card-details-box mt-1" id="card-details">
                            <span class="card-icon-inner">💳</span>
                            <label>Card Number</label>
                            <input type="text" placeholder="1234 5678 9012 3456">
                            <div class="grid-2 mt-1">
                                <div>
                                    <label>Expiry Date</label>
                                    <input type="text" placeholder="MM/YY">
                                </div>
                                <div>
                                    <label>CVV</label>
                                    <input type="text" placeholder="123">
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="hidden-submit" id="hidden-submit" style="display:none;"></button>
                </form>
            </div>
            
            <div class="checkout-summary-container">
                <div class="summary-card">
                    <h3>Order Summary</h3>
                    <div id="checkout-items" class="mt-1">
                        <!-- JS populated -->
                    </div>
                    <div class="summary-row total-row mt-1 pt-1">
                        <span>Final Total</span>
                        <span id="checkout-total">$0.00</span>
                    </div>
                    <button class="btn btn-dark w-100 mt-1" id="trigger-checkout">PLACE ORDER</button>
                </div>
                <div id="checkout-success" class="success-box bounce mt-1" style="display:none;">
                    <h3>🎉 Order Placed Successfully!</h3>
                    <p>Thank you for your purchase.</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="#">Links</a> | 
                <a href="feedback.html">Support</a> | 
                <a href="#">FAQ</a> | 
                <a href="#">Terms</a>
            </div>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
