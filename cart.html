<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOY HAVEN - Shopping Cart</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E🧸%3C/text%3E%3C/svg%3E">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <div class="logo">TOY HAVEN</div>
            <div class="hamburger" id="hamburger">☰</div>
            <nav class="main-nav" id="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
                <a href="feedback.html">Support</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="page-title mt-1">Your Shopping Cart</h2>
        
        <div class="cart-layout mt-1">
            <div class="cart-table-container">
                <div class="cart-header">
                    <span>Product</span>
                    <span>Price</span>
                    <span>Qty</span>
                    <span>Subtotal</span>
                </div>
                <div id="cart-items" class="cart-items-list">
                
                </div>
                <div class="cart-actions mt-1">
                    <button id="clear-cart-btn" class="btn btn-outline">← CLEAR CART</button>
                </div>
            </div>
            
            <div class="cart-summary-container">
                <div class="summary-card">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>$0.00</span>
                    </div>
                    <div class="summary-row total-row mt-1 pt-1">
                        <span>Total</span>
                        <span id="summary-total">$0.00</span>
                    </div>
                    <button class="btn btn-dark w-100 mt-1" onclick="window.location.href='checkout.html'">PROCEED TO CHECKOUT</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="#">Links</a> | 
                <a href="feedback.html">Support</a> | 
                <a href="#">FAQ</a> | 
                <a href="#">Terms</a>
            </div>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
